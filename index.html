    let currentIndex = 0;
    const total = data.length;
    const cardTrack = document.getElementById('cardTrack');
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const themeToggle = document.getElementById('themeToggle');
    const pdfBtn = document.getElementById('pdfBtn');

    data.forEach((item, idx) => {
      const card = document.createElement('article');
      card.className = `card ${idx === 0 ? 'active' : 'slide-right'}`;
      card.id = `card-${idx}`;
      card.innerHTML = `
        <div class="question-content">${item.q}</div>
        <div class="action-container">
          <a class="btn-read" href="${item.url}" target="_blank" rel="noopener noreferrer">
            <span>Read Judgment</span>
            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          </a>
        </div>
      `;
      cardTrack.appendChild(card);
    });

    function updateView(newIndex, direction = 0) {
      if (newIndex < 0 || newIndex >= total || newIndex === currentIndex) return;

      const currentCard = document.getElementById(`card-${currentIndex}`);
      const nextCard = document.getElementById(`card-${newIndex}`);

      if (direction > 0) {
        currentCard.className = 'card slide-left';
        nextCard.className = 'card active';
      } else if (direction < 0) {
        currentCard.className = 'card slide-right';
        nextCard.className = 'card active';
      } else {
        currentCard.className = 'card slide-left';
        nextCard.className = 'card active';
      }

      currentIndex = newIndex;
      counter.textContent = `${currentIndex + 1} / ${total}`;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === total - 1;
    }

    prevBtn.addEventListener('click', () => updateView(currentIndex - 1, -1));
    nextBtn.addEventListener('click', () => updateView(currentIndex + 1, 1));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        updateView(currentIndex + 1, 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        updateView(currentIndex - 1, -1);
      }
    });

    let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;

    cardTrack.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    cardTrack.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 45) {
        if (deltaX < 0) updateView(currentIndex + 1, 1);
        else updateView(currentIndex - 1, -1);
      }
    }, { passive: true });

    themeToggle.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.body.removeAttribute('data-theme');
        themeToggle.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
      } else {
        document.body.setAttribute('data-theme', 'dark');
        themeToggle.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
      }
    });

    // Native jsPDF Generator (ASCII Read Judgment Button & Centered Coordinates)
    pdfBtn.addEventListener('click', () => {
      const originalHTML = pdfBtn.innerHTML;
      pdfBtn.innerHTML = '<span>Saving...</span>';
      pdfBtn.disabled = true;

      setTimeout(() => {
        try {
          const jsPDFClass = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : window.jsPDF;
          if (!jsPDFClass) {
            alert('PDF generator library could not be loaded. Please check your connection.');
            return;
          }

          const doc = new jsPDFClass({
            orientation: 'portrait',
            unit: 'pt',
            format: 'a4'
          });

          const pageWidth = doc.internal.pageSize.getWidth();
          const pageHeight = doc.internal.pageSize.getHeight();
          const margin = 42;
          const textMaxWidth = pageWidth - (margin * 2);
          const footerMargin = 38;

          let y = 62;

          function drawHeader(isFirstPage) {
            doc.setFont('times', 'bold');
            doc.setFontSize(15);
            doc.setTextColor(17, 17, 17);
            doc.text('CiteCase', margin, 32);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8);
            doc.setTextColor(120, 120, 120);
            doc.text('QUESTIONS OF LAW', margin, 43);

            doc.setDrawColor(215, 215, 215);
            doc.setLineWidth(0.75);
            doc.line(margin, 50, pageWidth - margin, 50);
          }

          function drawFooter(pageNo, totalPages) {
            doc.setFont('times', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(130, 130, 130);
            doc.text(
              `CiteCase - Page ${pageNo} of ${totalPages}`,
              pageWidth / 2,
              pageHeight - 20,
              { align: 'center' }
            );
          }

          drawHeader(true);

          data.forEach((item, index) => {
            const numText = `${index + 1}. `;
            const fullQuestion = `${numText}${item.q}`;
            
            doc.setFont('times', 'normal');
            doc.setFontSize(10.5);
            const questionLines = doc.splitTextToSize(fullQuestion, textMaxWidth);
            const btnHeight = 20;
            const blockHeight = (questionLines.length * 15) + btnHeight + 20;

            if (y + blockHeight > pageHeight - footerMargin) {
              doc.addPage();
              drawHeader(false);
              y = 70;
            }

            // Question Text
            doc.setTextColor(26, 26, 26);
            doc.text(questionLines, margin, y);
            y += (questionLines.length * 15) + 6;

            // "Read Judgment" Button Box
            const btnWidth = 95;
            
            doc.setDrawColor(30, 30, 30);
            doc.setLineWidth(0.75);
            doc.roundedRect(margin, y, btnWidth, btnHeight, 3, 3, 'S');

            // Set clean standard text without unicode arrows
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8.5);
            doc.setTextColor(20, 20, 20);
            doc.text('Read Judgment', margin + (btnWidth / 2), y + (btnHeight / 2), {
              align: 'center',
              baseline: 'middle'
            });

            // Clickable URL covering the entire box
            doc.link(margin, y, btnWidth, btnHeight, { url: item.url });

            // Bottom Divider
            y += btnHeight + 12;
            doc.setDrawColor(240, 240, 236);
            doc.setLineWidth(0.5);
            doc.line(margin, y, pageWidth - margin, y);
            y += 14;
          });

          // Single Subscribe Banner at Document End
          const subscribeBoxHeight = 56;
          if (y + subscribeBoxHeight > pageHeight - footerMargin) {
            doc.addPage();
            drawHeader(false);
            y = 70;
          } else {
            y += 10;
          }

          const ctaWidth = 260;
          const ctaHeight = 28;
          const ctaX = (pageWidth - ctaWidth) / 2;

          doc.setFillColor(17, 17, 17);
          doc.roundedRect(ctaX, y, ctaWidth, ctaHeight, 4, 4, 'F');

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9.5);
          doc.setTextColor(255, 255, 255);
          doc.text('Subscribe CaseCiter To Access Judgments', ctaX + (ctaWidth / 2), y + (ctaHeight / 2), {
            align: 'center',
            baseline: 'middle'
          });
          doc.link(ctaX, y, ctaWidth, ctaHeight, { url: 'https://caseciter.in/pricing' });

          const totalPages = doc.internal.getNumberOfPages();
          for (let p = 1; p <= totalPages; p++) {
            doc.setPage(p);
            drawFooter(p, totalPages);
          }

          const blob = doc.output('blob');
          const blobUrl = URL.createObjectURL(blob);
          const downloadLink = document.createElement('a');
          downloadLink.href = blobUrl;
          downloadLink.download = 'CiteCase-Questions-Of-Law.pdf';
          document.body.appendChild(downloadLink);
          downloadLink.click();
          document.body.removeChild(downloadLink);
          setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);

        } catch (err) {
          console.error(err);
          alert('An error occurred while generating the PDF. Please try again.');
        } finally {
          pdfBtn.innerHTML = originalHTML;
          pdfBtn.disabled = false;
        }
      }, 50);
    });

    prevBtn.disabled = true;
  </script>
